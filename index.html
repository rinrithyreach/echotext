    <!-- Apply the saved theme before first paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('voiceai:settings') || '{}');
          var t = s.theme || 'dark';
          if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
          if (s.uiLanguage === 'km') { document.documentElement.setAttribute('lang', 'km'); document.documentElement.className += ' ui-km'; }
        } catch (e) {}
      })();
    </script>
